name: PR-Gauntlet Score

on:
  pull_request_target:
    branches: [v1-bugged]
  push:
    branches: [v1-bugged]

jobs:
  score:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Lock scoring files to v1-bugged
        run: git fetch origin v1-bugged && git checkout FETCH_HEAD -- scoring/

      - name: Run scorer
        id: score
        run: |
          RESULT=$(npx ts-node --project ../scoring/tsconfig.json ../scoring/index.ts --json 2>&1)
          JSON=$(echo "$RESULT" | python3 -c "import sys; t=sys.stdin.read(); s=t.find('{'); print(t[s:].strip() if s>=0 else '{}')")
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$JSON" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          FINAL=$(echo "$JSON" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('finalScore',0))")
          echo "final=$FINAL" >> $GITHUB_OUTPUT
        working-directory: app

      - name: Score summary (push)
        if: github.event_name == 'push'
        run: |
          echo "### PR-Gauntlet Score: ${{ steps.score.outputs.final }}/110" >> $GITHUB_STEP_SUMMARY
          echo "Branch: ${{ github.ref_name }} @ ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Post score comment (PR only)
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(process.env.SCORE_JSON);
            const { fixed, total, baseScore, chainBonus, finalScore, results } = result;
            const tierEmoji = { 1: 'T1', 2: 'T2', 3: 'T3', 4: 'T4' };
            const rows = results.map(r =>
              `| ${r.id} | ${r.title} | ${tierEmoji[r.tier]} | ${r.passed ? 'PASS' : 'fail'} |`
            ).join('\n');
            const chainNote = chainBonus === 10
              ? 'Chain solved — root cause found, all 5 chain issues resolved!'
              : chainBonus === 5 ? 'Partial chain (18-20 resolved)' : 'Chain not solved';
            const lines = [
              `## PR-Gauntlet Score: ${finalScore}/110`,
              '',
              `${fixed}/${total} issues fixed | Base: ${baseScore} | Chain bonus: +${chainBonus}`,
              '',
              chainNote,
              '',
              '| # | Issue | Tier | Status |',
              '|---|-------|------|--------|',
              rows,
              '',
              'Run `npx ts-node ../scoring/index.ts` locally to debug individual issues.',
              '',
              '_PRs are scored but not merged — `v1-bugged` stays frozen as the benchmark baseline._',
            ];
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: lines.join('\n'),
            });
        env:
          SCORE_JSON: "${{ steps.score.outputs.result }}"

      - name: Update leaderboard (PR only)
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          script: |
            const finalScore = parseInt('${{ steps.score.outputs.final }}');
            if (finalScore < 30) return; // skip trivial scores

            const result = JSON.parse(process.env.SCORE_JSON);
            const { fixed, total, chainBonus } = result;

            const agent = context.payload.pull_request.head.ref;
            const date = new Date().toISOString().split('T')[0];
            const issueStr = `${fixed}/${total}`;
            const chainStr = chainBonus > 0 ? `+${chainBonus}` : '0';
            const scoreStr = `${finalScore}/110`;

            // Fetch current LEADERBOARD.md from v1-bugged
            let fileData;
            try {
              ({ data: fileData } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'LEADERBOARD.md',
                ref: 'v1-bugged',
              }));
            } catch (e) {
              console.log('Could not fetch LEADERBOARD.md:', e.message);
              return;
            }

            const current = Buffer.from(fileData.content, 'base64').toString('utf8');

            // Parse the main leaderboard table (first table block)
            const tableRe = /(\| Rank \|[^\n]+\n\|[-| ]+\|)((?:\n\|[^\n]+)*)/;
            const match = current.match(tableRe);
            if (!match) { console.log('Table not found in LEADERBOARD.md'); return; }

            const existingRows = match[2].trim().split('\n').filter(r => r.trim().startsWith('|'));
            const parseScore = row => {
              const cols = row.split('|').map(c => c.trim()).filter(Boolean);
              const scoreCol = cols[5] || '';
              return parseInt(scoreCol.split('/')[0]) || 0;
            };

            const scores = existingRows.map(parseScore);
            const wouldRank = scores.filter(s => s > finalScore).length + 1;

            if (wouldRank > 10) {
              console.log(`Score ${finalScore} would rank #${wouldRank} — outside top 10, skipping leaderboard update`);
              return;
            }

            // Build new row and insert at correct position
            const newRow = `| ${wouldRank} | ${agent} | Hard | ${issueStr} | ${chainStr} | ${scoreStr} | — | ${date} |`;
            const before = existingRows.slice(0, wouldRank - 1);
            const after  = existingRows.slice(wouldRank - 1);
            const reranked = [...before, newRow, ...after]
              .slice(0, 10) // keep top 10
              .map((row, i) => row.replace(/^\| \d+/, `| ${i + 1}`));

            const updatedTable = match[1] + '\n' + reranked.join('\n');
            const updated = current.replace(tableRe, updatedTable);

            if (updated === current) { console.log('No change needed'); return; }

            // Commit back to v1-bugged using the API (SHA-locked, race-safe)
            try {
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'LEADERBOARD.md',
                message: `leaderboard: ${agent} scores ${scoreStr} (rank #${wouldRank})`,
                content: Buffer.from(updated).toString('base64'),
                sha: fileData.sha,
                branch: 'v1-bugged',
              });
              console.log(`Leaderboard updated — ${agent} entered at rank #${wouldRank}`);
            } catch (e) {
              console.log('Leaderboard update failed (possible race):', e.message);
              return;
            }

            // Celebrate on the PR
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `**Leaderboard:** \`${agent}\` entered at **rank #${wouldRank}** with **${scoreStr}**! View the [leaderboard](../blob/v1-bugged/LEADERBOARD.md).`,
            });
        env:
          SCORE_JSON: "${{ steps.score.outputs.result }}"
