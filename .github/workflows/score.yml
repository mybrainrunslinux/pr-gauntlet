name: PR-Gauntlet Score

on:
  pull_request:
    branches: [v1-bugged]

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: app

      - name: Run scorer
        id: score
        run: |
          RESULT=$(npx ts-node ../scoring/index.ts --json 2>/dev/null)
          echo "result<<EOF" >> $GITHUB_OUTPUT
          echo "$RESULT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          FINAL=$(echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['finalScore'])")
          echo "final=$FINAL" >> $GITHUB_OUTPUT
        working-directory: app

      - name: Post score comment
        uses: actions/github-script@v7
        with:
          script: |
            const result = JSON.parse(`${{ steps.score.outputs.result }}`);
            const { fixed, total, baseScore, chainBonus, finalScore, results } = result;

            const tierEmoji = { 1: '🟢', 2: '🟡', 3: '🟠', 4: '🔴' };
            const rows = results.map(r =>
              `| ${r.id} | ${r.title} | ${tierEmoji[r.tier]} T${r.tier} | ${r.passed ? '✅' : '❌'} |`
            ).join('\n');

            const chainNote = chainBonus === 10
              ? '⭐ **Chain solved** — root cause found, all 5 chain issues resolved!'
              : chainBonus === 5
              ? '◐ **Partial chain** — issues 18–20 resolved'
              : '❌ Chain not solved';

            const body = `## PR-Gauntlet Score: ${finalScore}/110

**${fixed}/${total} issues fixed** · Base: ${baseScore} · Chain bonus: +${chainBonus}

${chainNote}

| # | Issue | Tier | Status |
|---|-------|------|--------|
${rows}

*Run \`npx pr-gauntlet score\` locally to debug individual issues.*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
